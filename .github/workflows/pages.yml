# Publica a versão web (LimpaIA.html da release) em https://alberthpalhares.github.io/limpaia/
name: Site (versão web)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o LimpaIA.html da release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir site
          # sem TAG (execução manual): a release mais recente
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern LimpaIA.html --dir site
          mv site/LimpaIA.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
